apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: servicelevelobjectives.kubeguard.bukx.dev
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
spec:
  group: kubeguard.bukx.dev
  names:
    kind: ServiceLevelObjective
    listKind: ServiceLevelObjectiveList
    plural: servicelevelobjectives
    singular: servicelevelobjective
    shortNames:
      - slo
      - slos
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Service
          type: string
          jsonPath: .spec.service
        - name: Target
          type: string
          jsonPath: .spec.target
        - name: Compliance
          type: string
          jsonPath: .status.currentCompliance
        - name: Budget
          type: string
          jsonPath: .status.errorBudgetRemaining
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: ServiceLevelObjective is the Schema for the servicelevelobjectives API.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - service
                - target
                - window
                - indicator
              properties:
                service:
                  type: string
                description:
                  type: string
                target:
                  type: string
                  pattern: '^\d+(\.\d+)?$'
                window:
                  type: string
                indicator:
                  type: object
                  required:
                    - type
                    - totalQuery
                  properties:
                    type:
                      type: string
                      enum: [availability, latency]
                    totalQuery:
                      type: string
                    errorQuery:
                      type: string
                    thresholdQuery:
                      type: string
                alerting:
                  type: object
                  properties:
                    burnRateThresholds:
                      type: array
                      items:
                        type: object
                        properties:
                          severity:
                            type: string
                          shortWindow:
                            type: string
                          longWindow:
                            type: string
                          factor:
                            type: string
            status:
              type: object
              properties:
                currentCompliance:
                  type: string
                errorBudgetRemaining:
                  type: string
                lastCalculation:
                  type: string
                  format: date-time
                prometheusRuleRef:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
